<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Magic Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; touch-action: none; }
        canvas { display: block; }
        
        /* Mobile Preview Box */
        #video-container {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px; /* Chota preview mobile ke liye */
            height: 75px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            z-index: 10;
            overflow: hidden;
            transform: scaleX(-1);
            opacity: 0.7;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Instructions Overlay */
        #ui {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            font-family: sans-serif;
            font-size: 14px;
            text-shadow: 0 2px 4px black;
        }
        .loading-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-family: sans-serif;
            font-size: 20px;
            z-index: 100;
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="loading" class="loading-text"></div>

<div id="video-container">
    <video class="input_video" playsinline webkit-playsinline muted autoplay></video>
</div>

<div id="ui"><br>
</div>

<script>
    // --- MOBILE SETTINGS ---
    const PARTICLE_COUNT = 3000; // Mobile ke liye kam particles
    const PARTICLE_SIZE = 0.4;   // Size bada kiya taaki visible ho
    
    // --- THREE.JS ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 35;

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); // Antialias off for speed
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel density
    document.body.appendChild(renderer.domElement);

    // --- PARTICLES ---
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    const targetColors = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 80;
        colors[i] = 1.0;
        targetPositions[i] = positions[i];
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: PARTICLE_SIZE,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.8
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // --- SHAPES ---
    function setShape(type) {
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const idx = i * 3;
            let x, y, z, r, g, b;

            if (type === 'sphere') {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                const rad = 10;
                x = rad * Math.cos(theta) * Math.sin(phi);
                y = rad * Math.sin(theta) * Math.sin(phi);
                z = rad * Math.cos(phi);
                r=0.2; g=0.8; b=1.0; 
            } else if (type === 'heart') {
                const t = Math.random() * Math.PI * 2;
                const scale = 0.5;
                x = (16 * Math.pow(Math.sin(t), 3)) * scale;
                y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
                z = (Math.random() - 0.5) * 5;
                y += 2;
                r=1.0; g=0.2; b=0.5;
            } else if (type === 'flower') {
               const u = Math.random() * Math.PI * 2;
               const v = Math.random() * Math.PI;
               const rad = 10;
               const k = 3; 
               const r_flower = Math.cos(k * u);
               x = rad * r_flower * Math.cos(u) * Math.sin(v);
               y = rad * r_flower * Math.sin(u) * Math.sin(v);
               z = (Math.random()-0.5) * 5;
               r=0.6; g=0.2; b=1.0;
            }
            targetPositions[idx] = x;
            targetPositions[idx+1] = y;
            targetPositions[idx+2] = z;
            targetColors[idx] = r;
            targetColors[idx+1] = g;
            targetColors[idx+2] = b;
        }
    }

    const shapes = ['sphere', 'heart', 'flower'];
    let currentShapeIdx = 0;
    setShape('sphere');

    // --- GESTURE ---
    let handExpansion = 0;
    let isPinching = false;
    let lastPinchTime = 0;
    let handRotX = 0;
    let handRotY = 0;

    function onHandsResults(results) {
        document.getElementById('loading').style.display = 'none'; // Hide loading text
        
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            
            // Rotation
            handRotY = (landmarks[9].x - 0.5) * 4;
            handRotX = (landmarks[9].y - 0.5) * 4;

            // Pinch (Thumb & Index)
            const dx = landmarks[4].x - landmarks[8].x;
            const dy = landmarks[4].y - landmarks[8].y;
            const pinchDist = Math.sqrt(dx*dx + dy*dy);

            // Open/Close (Wrist to Middle Tip)
            const wx = landmarks[0].x - landmarks[12].x;
            const wy = landmarks[0].y - landmarks[12].y;
            const openDist = Math.sqrt(wx*wx + wy*wy);

            if (openDist > 0.4) handExpansion = 15; // Explode
            else if (openDist < 0.2) handExpansion = -10; // Implode
            else handExpansion = 0;

            if (pinchDist < 0.06) {
                if (!isPinching && Date.now() - lastPinchTime > 1000) {
                    isPinching = true;
                    lastPinchTime = Date.now();
                    currentShapeIdx = (currentShapeIdx + 1) % shapes.length;
                    setShape(shapes[currentShapeIdx]);
                }
            } else {
                isPinching = false;
            }
        }
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0, // 0 is fastest (Lite model) for mobile
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults(onHandsResults);

    const videoElement = document.getElementsByClassName('input_video')[0];
    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 320,
        height: 240,
        facingMode: "user" // Force Front Camera
    });
    cameraUtils.start();

    // --- ANIMATION ---
    let currentExp = 0;
    function animate() {
        requestAnimationFrame(animate);
        
        currentExp += (handExpansion - currentExp) * 0.1;
        particles.rotation.x += (handRotX - particles.rotation.x) * 0.1;
        particles.rotation.y += (handRotY - particles.rotation.y) * 0.1;
        particles.rotation.z += 0.002;

        const pos = particles.geometry.attributes.position.array;
        const col = particles.geometry.attributes.color.array;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const idx = i * 3;
            let tx = targetPositions[idx];
            let ty = targetPositions[idx+1];
            let tz = targetPositions[idx+2];

            // Expansion
            const len = Math.sqrt(tx*tx + ty*ty + tz*tz) || 1;
            tx += (tx/len) * currentExp;
            ty += (ty/len) * currentExp;
            tz += (tz/len) * currentExp;

            pos[idx] += (tx - pos[idx]) * 0.1;
            pos[idx+1] += (ty - pos[idx+1]) * 0.1;
            pos[idx+2] += (tz - pos[idx+2]) * 0.1;
            
            col[idx] += (targetColors[idx] - col[idx]) * 0.05;
            col[idx+1] += (targetColors[idx+1] - col[idx+1]) * 0.05;
            col[idx+2] += (targetColors[idx+2] - col[idx+2]) * 0.05;
        }
        
        particles.geometry.attributes.position.needsUpdate = true;
        particles.geometry.attributes.color.needsUpdate = true;
        renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
